name: Bug report
description: Report something that is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: environment-os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - iOS / Android
    validations:
      required: true
  - type: dropdown
    id: environment-browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Add any screenshot, console output or log that helps illustrate the issue.
    validations:
      required: false
